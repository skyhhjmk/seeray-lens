quarkus.application.name=seeray-lens
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SEERAY_DB_USERNAME:seeray}
quarkus.datasource.password=${SEERAY_DB_PASSWORD:seeray}
quarkus.datasource.jdbc.url=${SEERAY_DB_JDBC_URL:jdbc:postgresql://localhost:5432/seeray_lens}
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.redis.hosts=${SEERAY_REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.devservices.enabled=false
quarkus.rabbitmq.devservices.enabled=false
mp.messaging.connector.smallrye-rabbitmq.host=${SEERAY_RABBITMQ_HOST:localhost}
mp.messaging.connector.smallrye-rabbitmq.port=${SEERAY_RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${SEERAY_RABBITMQ_USERNAME:seeray}
mp.messaging.connector.smallrye-rabbitmq.password=${SEERAY_RABBITMQ_PASSWORD:seeray}
mp.messaging.outgoing.tracking-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.tracking-out.exchange.name=seeray.tracking
mp.messaging.outgoing.tracking-out.default-routing-key=event.v1
mp.messaging.outgoing.tracking-out.delivery-mode=persistent
mp.messaging.outgoing.tracking-out.publish-confirms=true
mp.messaging.outgoing.tracking-out.content-type=application/json
mp.messaging.incoming.tracking-in.connector=smallrye-rabbitmq
mp.messaging.incoming.tracking-in.queue.name=seeray.tracking.ingest.v1
mp.messaging.incoming.tracking-in.exchange.name=seeray.tracking
mp.messaging.incoming.tracking-in.routing-keys=event.v1
mp.messaging.incoming.tracking-in.durable=true
mp.messaging.incoming.tracking-in.queue.x-queue-type=quorum
mp.messaging.incoming.tracking-in.queue.x-delivery-limit=5
mp.messaging.incoming.tracking-in.failure-strategy=reject
mp.messaging.incoming.tracking-in.concurrency=4
mp.messaging.incoming.tracking-in.content-type=application/json
# Queue type/DLX are provisioned by deployment manifests; do not mutate an existing queue here.
seeray.ingestion.max-batch-size=${SEERAY_INGESTION_MAX_BATCH_SIZE:500}
seeray.collector.rate-limit-per-minute=${SEERAY_COLLECTOR_RATE_LIMIT_PER_MINUTE:600}
quarkus.log.console.json=true
quarkus.log.console.json.additional-field."service".value=seeray-lens
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.swagger-ui.always-include=true
quarkus.otel.enabled=${SEERAY_OTEL_ENABLED:false}
quarkus.otel.service.name=seeray-lens
seeray.auth.jwt-secret=${SEERAY_AUTH_JWT_SECRET:change-me-in-production-change-me-in-production}
seeray.auth.access-token-seconds=${SEERAY_AUTH_ACCESS_TOKEN_SECONDS:900}
seeray.auth.jwt-issuer=${SEERAY_AUTH_JWT_ISSUER:seeray-lens}
seeray.auth.refresh-token-days=${SEERAY_AUTH_REFRESH_TOKEN_DAYS:30}
quarkus.http.cors.enabled=true
# Browser events are sent from each site's own origin.  The collector validates
# the event URL and Origin against that site's configured allowed domains, so
# CORS must not be limited to the admin's localhost origin.
quarkus.http.cors.origins=${SEERAY_CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.http.limits.max-body-size=64K
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.rabbitmq.devservices.enabled=false
%test.quarkus.liquibase.migrate-at-start=true
