<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Privacy preferences</title>
    <link rel="stylesheet" href="/privacy/preferences.css">
    <script src="/privacy/preferences.js" defer></script>
  </head>
  <body>
    <main id="seeray-privacy-preferences" data-site-id="__SEERAY_TRACKING_ID__">
      <h1 data-copy="heading">Privacy preferences</h1>
      <p data-copy="description">Choose whether this site may collect anonymous analytics on this browser.</p>
      <p id="seeray-privacy-status" role="status" aria-live="polite" data-copy="connecting">Connecting to this site's tracker…</p>
      <div class="actions">
        <button id="seeray-privacy-allow" type="button" disabled data-copy="allow">Allow analytics</button>
        <button id="seeray-privacy-deny" type="button" disabled data-copy="deny">Opt out</button>
      </div>
      <p class="note" data-copy="note">This choice is stored by the tracker in this browser and applies only to this site.</p>
    </main>
  </body>
</html>
