name: Build Linux packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'admin/**'
      - 'packaging/aur/seeray-lens-admin/**'
  pull_request:
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'admin/**'
      - 'packaging/aur/seeray-lens-admin/**'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-linux-bundle:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libasound2-dev libcups2-dev libdrm-dev libgbm-dev libgtk-3-dev libnss3-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxshmfence-dev libxtst-dev ninja-build pkg-config

      - name: Read application version
        id: version
        shell: bash
        run: |
          value="$(sed -n 's/^version: *\([0-9][0-9.]*\)\(+.*\)\{0,1\}$/\1/p' admin/pubspec.yaml | head -n1)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Analyze, test, and build Linux release
        working-directory: admin
        run: |
          flutter pub get
          flutter analyze
          flutter test
          mkdir -p build/native_assets/linux
          flutter build linux --release

      - name: Stage installation tree
        run: |
          mkdir -p package-root/opt/seeray-lens-admin
          cp -a admin/build/linux/x64/release/bundle/. package-root/opt/seeray-lens-admin/
          install -Dm755 packaging/aur/seeray-lens-admin/seeray-lens-admin.sh package-root/usr/bin/seeray-lens-admin
          install -Dm644 packaging/aur/seeray-lens-admin/seeray-lens-admin.desktop package-root/usr/share/applications/seeray-lens-admin.desktop
          install -Dm644 LICENSE package-root/usr/share/licenses/seeray-lens-admin/LICENSE
          install -Dm644 admin/assets/seeray-lens-logo.png package-root/usr/share/pixmaps/seeray-lens-admin.png
          tar -czf seeray-lens-admin-root.tar.gz -C package-root .

      - uses: actions/upload-artifact@v7
        with:
          name: seeray-lens-admin-root
          path: seeray-lens-admin-root.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-24.04
    needs: build-linux-bundle
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-root
          path: stage
      - name: Build Debian package
        env:
          APP_VERSION: ${{ needs.build-linux-bundle.outputs.version }}
        run: |
          mkdir -p stage-root dist
          tar -xzf stage/seeray-lens-admin-root.tar.gz -C stage-root
          mkdir -p stage-root/DEBIAN
          cat > stage-root/DEBIAN/control <<EOF
          Package: seeray-lens-admin
          Version: ${APP_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Bili_Wind
          Depends: libgtk-3-0, libnss3, libasound2t64 | libasound2, libcups2t64 | libcups2, libdrm2, libgbm1, libxcomposite1, libxdamage1, libxfixes3, libxi6, libxkbcommon0, libxrandr2, libxshmfence1, libxtst6
          Description: Desktop administration client for SeeRay Lens
          EOF
          dpkg-deb --root-owner-group --build stage-root "dist/seeray-lens-admin_${APP_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: seeray-lens-admin-deb-${{ needs.build-linux-bundle.outputs.version }}
          path: dist/*.deb
          retention-days: 30
          if-no-files-found: error

  build-rpm:
    runs-on: ubuntu-24.04
    needs: build-linux-bundle
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-root
          path: stage
      - name: Install RPM builder
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM package
        env:
          APP_VERSION: ${{ needs.build-linux-bundle.outputs.version }}
        shell: bash
        run: |
          mkdir -p stage-root rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES/root,SPECS,SRPMS} dist
          tar -xzf stage/seeray-lens-admin-root.tar.gz -C stage-root
          cp -a stage-root/. rpmbuild/SOURCES/root/
          cat > rpmbuild/SPECS/seeray-lens-admin.spec <<EOF
          Name: seeray-lens-admin
          Version: ${APP_VERSION}
          Release: 1%{?dist}
          Summary: Desktop administration client for SeeRay Lens
          License: BSD-3-Clause
          BuildArch: x86_64
          Requires: alsa-lib
          Requires: at-spi2-core
          Requires: cups-libs
          Requires: gtk3
          Requires: libXcomposite
          Requires: libXdamage
          Requires: libXfixes
          Requires: libXi
          Requires: libXrandr
          Requires: libXtst
          Requires: libdrm
          Requires: libxkbcommon
          Requires: libxshmfence
          Requires: mesa-libgbm
          Requires: nspr
          Requires: nss

          %description
          Desktop administration client for SeeRay Lens.

          %install
          mkdir -p %{buildroot}
          cp -a %{_sourcedir}/root/. %{buildroot}/

          %files
          /opt/seeray-lens-admin
          /usr/bin/seeray-lens-admin
          /usr/share/applications/seeray-lens-admin.desktop
          /usr/share/licenses/seeray-lens-admin/LICENSE
          /usr/share/pixmaps/seeray-lens-admin.png
          EOF
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/seeray-lens-admin.spec
          find rpmbuild/RPMS -type f -name '*.rpm' -exec cp {} dist/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: seeray-lens-admin-rpm-${{ needs.build-linux-bundle.outputs.version }}
          path: dist/*.rpm
          retention-days: 30
          if-no-files-found: error

  build-arch:
    runs-on: ubuntu-24.04
    needs: build-linux-bundle
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-root
          path: stage
      - name: Build Arch package
        env:
          APP_VERSION: ${{ needs.build-linux-bundle.outputs.version }}
        shell: bash
        run: |
          mkdir -p arch-build/root
          tar -xzf stage/seeray-lens-admin-root.tar.gz -C arch-build/root
          tar -czf arch-build/seeray-lens-admin-root.tar.gz -C arch-build root
          checksum="$(sha256sum arch-build/seeray-lens-admin-root.tar.gz | cut -d' ' -f1)"
          cat > arch-build/PKGBUILD <<EOF
          pkgname=seeray-lens-admin
          pkgver=${APP_VERSION}
          pkgrel=1
          pkgdesc='Desktop administration client for SeeRay Lens'
          arch=('x86_64')
          url='https://github.com/skyhhjmk/seeray-lens'
          license=('BSD-3-Clause')
          options=('!debug')
          depends=('alsa-lib' 'at-spi2-core' 'gtk3' 'libcups' 'libdrm' 'libxcomposite' 'libxdamage' 'libxi' 'libxfixes' 'libxkbcommon' 'libxrandr' 'libxshmfence' 'libxtst' 'mesa' 'nspr' 'nss')
          source=('seeray-lens-admin-root.tar.gz')
          sha256sums=('${checksum}')

          package() {
            cp -a "\$srcdir/root/." "\$pkgdir/"
          }
          EOF
          docker run --rm -v "$PWD/arch-build:/work" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel alsa-lib at-spi2-core gtk3 libcups libdrm libxcomposite libxdamage libxi libxfixes libxkbcommon libxrandr libxshmfence libxtst mesa nspr nss
            useradd --create-home builder
            chown -R builder:builder /work
            su builder -s /bin/bash -c "cd /work && makepkg --clean --noconfirm"
          '
          mkdir -p dist
          cp arch-build/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v7
        with:
          name: seeray-lens-admin-arch-${{ needs.build-linux-bundle.outputs.version }}
          path: dist/*.pkg.tar.zst
          retention-days: 30
          if-no-files-found: error

  build-appimage:
    runs-on: ubuntu-24.04
    needs: build-linux-bundle
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-root
          path: stage
      - name: Install AppImage build tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build AppImage
        env:
          APP_VERSION: ${{ needs.build-linux-bundle.outputs.version }}
        shell: bash
        run: |
          mkdir -p stage-root appdir dist
          tar -xzf stage/seeray-lens-admin-root.tar.gz -C stage-root
          cp -a stage-root/. appdir/
          cat > appdir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/opt/seeray-lens-admin/seeray_lens_admin" "$@"
          EOF
          chmod 755 appdir/AppRun
          sed 's/^Exec=.*/Exec=AppRun/' appdir/usr/share/applications/seeray-lens-admin.desktop > appdir/seeray-lens-admin.desktop
          ln -s usr/share/pixmaps/seeray-lens-admin.png appdir/seeray-lens-admin.png
          ln -s seeray-lens-admin.png appdir/.DirIcon
          curl --fail --location --retry 3 --output appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod 755 appimagetool-x86_64.AppImage
          ARCH=x86_64 VERSION="$APP_VERSION" APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage --no-appstream appdir "dist/seeray-lens-admin-${APP_VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: seeray-lens-admin-appimage-${{ needs.build-linux-bundle.outputs.version }}
          path: dist/*.AppImage
          retention-days: 30
          if-no-files-found: error

  attach-release-packages:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    needs: [build-linux-bundle, build-deb, build-rpm, build-arch, build-appimage]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-deb-${{ needs.build-linux-bundle.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-rpm-${{ needs.build-linux-bundle.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-arch-${{ needs.build-linux-bundle.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: seeray-lens-admin-appimage-${{ needs.build-linux-bundle.outputs.version }}
          path: dist
      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
